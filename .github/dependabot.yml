# Dependency updates. A person cannot check versions weekly; without this the
# pins age in silence.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Grouped: one pull request per group, not one per package. Security
    # updates bypass grouping and schedule and open at once, so grouping never
    # delays a CVE fix. No cooldown: GitHub's default waits three days after a
    # release of each package a pull request names. A package `uv lock` moves
    # along with them is not held: Dependabot runs `uv lock --upgrade-package`
    # for the package it names, with no age limit (read in dependabot-core,
    # plinth #949). These groups and the cooldown are this
    # project's to change: docs/how-to/keep-this-project-current.md says when.
    groups:
      # Development tools (ruff, mypy, pytest) in one pull request; a break
      # here breaks CI, not the product.
      dev-tools:
        dependency-type: "development"
      # Runtime dependencies: minor and patch together. A major comes alone,
      # because it may break and is reviewed on its own.
      runtime-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # The reusable workflows are pinned to a bare commit SHA of coolbress/plinth,
  # with no version comment. Dependabot reads the release from the SHA itself
  # and raises ci.yml and label.yml together in one pull request, after
  # GitHub's default three-day cooldown (measured on a rendered repository,
  # plinth #447).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
