[project]
name = "nexusbt-tds"
# Versioned apart from the engine: `tds_version` "1.0", package version the matching 1.0.x (2.3).
version = "1.0.0"
description = "The TDS data standard's conformance checker: check, hash, manifest, describe, import"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "coolbress" }]
classifiers = ["Typing :: Typed"]
# pyarrow only (2.3), from the value hash (TDS 4.5) on; the engine's range (2.2).
dependencies = ["pyarrow>=26.0.0,<27"]

[project.scripts]
tds = "nexusbt_tds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The schema files are `schemas/` (spec 9.1, T0.13b) and the checker reads them as package data
# `nexusbt_tds/schemas/data` (#145), a link to `schemas/` in a checkout. A build walks a folder
# once, so the link is left out and the wheel takes the files from `schemas/` itself: built
# straight from the checkout or from the sdist, which carries `schemas/` and not the link.
[tool.hatch.build.targets.wheel]
exclude = ["/src/nexusbt_tds/schemas/data"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "nexusbt_tds/schemas/data"
