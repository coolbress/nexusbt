[project]
name = "nexusbt"
version = "0.1.0"
description = "One line saying what this is"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "coolbress" }]
# The package ships `py.typed`: a type checker reads its annotations.
classifiers = ["Typing :: Typed"]
# `nexusbt-tds>=1.0,<2` (spec 9.1): `data` calls the checker when it opens a snapshot (T1.1a).
# pyarrow, for the `pa.Table` of 2.4: 2.2's lock version; the range leaves patch releases
# to uv.lock. numpy: 2.2's 2.5.3, below 2.6 for numba 0.68. exchange-calendars: 2.2's 4.13.2,
# exact; it brings pandas with it (#58 Decisions).
dependencies = ["nexusbt-tds>=1.0,<2", "pyarrow>=26.0.1,<27", "numpy>=2.5.4,<2.6",
                "exchange-calendars==4.13.2"]

[project.scripts]
nexusbt = "nexusbt.cli.main:main"

# Distribution metadata. Read by `pip show`, GitHub and the dependency graph
# even when the package is never uploaded.
[project.urls]
Homepage = "https://github.com/coolbress/nexusbt"
Issues = "https://github.com/coolbress/nexusbt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The workspace lock ships in the wheel: an installed engine copies it into every sealed
# run's `source/` (5.9.3, INV-03; #283). `tests/test_built_wheel.py` checks the copy.
[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "nexusbt/resources/uv.lock"

[dependency-groups]
dev = [
    # 2.2's 14-day rule: the newest release at least 14 days old on 2026-11-02, released
    # 2026-10-16. Exact, so `uv lock --upgrade` cannot take a newer one before it is 14 days
    # old; step 9 raises it. MPL-2.0, development only: not in the distribution (2.1).
    "hypothesis==6.170.15",
    "mypy>=2.4.1",
    "nexusbt-tds",  # the checker, from this workspace, so `uv run tds` works beside the engine
    "pytest>=9.2.0",
    # Reads the golden case files `tests/golden/cases/*.yaml` (8.2; #59 Decisions). 2.2 pins no
    # YAML library: the newest release, 2025-09-25, exact. MIT, development only.
    "pyyaml==6.0.3",
    "ruff>=0.17.4",
]

# Two distributions: the engine, and the checker `nexusbt-tds` under `tds/`, versioned apart (2.3).
[tool.uv.workspace]
members = ["tds"]

[tool.uv.sources]
nexusbt-tds = { workspace = true }

# Linter and formatter. The configuration is committed; CI runs `ruff check`
# and `ruff format --check` as `ci / lint`.
[tool.ruff]
line-length = 100
src = ["src", "tds/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RUF", "TID251"]

# Spec 2.5: what `src/**` and `tds/src/**` never import or call, beside the AST test
# `tests/unit/test_import_rules.py`, which also catches `np.load(..., allow_pickle=True)`.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"zipline".msg = "spec 2.5: no zipline import; compat imitates its names"
"nautilus_trader".msg = "spec 2.5: no nautilus_trader import; the E4 bridge is Protocols only"
"duckdb".msg = "spec 2.5: no duckdb; the checker reads with pyarrow only"
"pickle".msg = "spec 2.5, 2.6: no pickle; Parquet, Arrow IPC or JSON"
"dill".msg = "spec 2.5, 2.6: no pickle-based serialisation"
"cloudpickle".msg = "spec 2.5, 2.6: no pickle-based serialisation"
"joblib".msg = "spec 2.5, 2.6: no pickle-based serialisation"
"shelve".msg = "spec 2.5, 2.6: no pickle-based storage"
"pandas.read_pickle".msg = "spec 2.5, 2.6: no pickle; read Parquet or Arrow IPC"

[tool.ruff.lint.per-file-ignores]
# The 2.5 ban is for `src/**` and `tds/src/**` only: every other path ignores it.
"!{src,tds/src}/**" = ["TID251"]
# assert is the normal form in tests
"tests/**" = ["S101"]
# and spec 8.4a names the checker's tests after their codes (`test_M012_path_escape`)
"tds/tests/**" = ["S101", "N802"]

# The spec is the single source of truth and TDS is versioned on its own: the
# formatter does not rewrite the Python examples inside their Markdown.
[tool.ruff.format]
exclude = ["docs/spec/**", "docs/tds/**"]

# Type checking, `ci / typecheck`.
[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tds/src", "tests", "tds/tests", "tds/conformance"]

# pyarrow 26 ships no `py.typed` and `pyarrow-stubs` targets pyarrow 20 (#61 Decisions):
# its names are `Any` to mypy. exchange-calendars 4.13.2 ships no `py.typed` either (#58),
# nor does PyYAML 6.0.3 (#59). Only these module names; every other setting stays strict.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "exchange_calendars", "yaml"]
ignore_missing_imports = true

# Tests, `ci / test`.
[tool.pytest.ini_options]
testpaths = ["tests", "tds/tests"]  # the checker's own tests too (spec 8.4a)
# No silent failures: an unregistered `@pytest.mark.foo` is a no-op even when
# it is a typo, and a misspelt key in this section is ignored. Both are made
# errors. Then 9.1's own: the default run leaves out the markers that run as
# separate jobs, and hypothesis runs its `ci` profile (both profiles: `conftest.py`).
addopts = [
    "--strict-markers",
    "--strict-config",
    "-m",
    "not parity and not perf_smoke and not examples and not slow",
    "--hypothesis-profile=ci",
]
# Spec 9.1's nine markers.
markers = [
    "unit: fast tests of one module",
    "golden: hand-calculated expected outputs (tests/golden, 8.2)",
    "property: hypothesis property tests (tests/property, 8.3)",
    "docs: documentation and example checks (8.5)",
    "examples: the full run of examples/ (job engine / docs-examples)",
    "parity: comparison with zipline-reloaded (job engine / parity)",
    "perf_smoke: CI performance smoke tests (job engine / perf-smoke)",
    "slow: long tests left out of the default run",
    "repo: repository hygiene and structure (2.7)",
]
# Warnings are errors. A third-party warning that blocks gets one narrow
# ignore here, with its reason.
filterwarnings = ["error"]

# Coverage, read by `ci / test` (plinth v2.23.0 measures the source named
# here; before it, `src/` only). TDS is a second package under `tds/src`,
# versioned apart from the engine, so it is named too (#109).
[tool.coverage.run]
source = ["src", "tds/src"]
