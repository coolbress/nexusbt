# T-25 (spec 8.2, 3.4): a built-in factor by hand over 5 rows. `check/T-25.py` reaches the same
# literals; implementation pull requests do not change this file. `expected` per row:
# null = warm-up (no full window in the 5 rows), .nan = the factor gives NaN.
factor: VWAP
spec: "3.4: sum(close * volume)/sum(volume) over the rows whose close and volume are both finite; no pair, or the pairs' volume summing to 0 -> NaN; minimum observations 1 pair; warm-up W-1. 8.2: VWAP(3) 10, NaN, 12 with 100, 300, 300 -> 11.5"
cases:
  - term: "VWAP(3)"
    # A row's close and volume are NaN together, or only its volume: both readings of "NaN left
    # out" (zipline's literal formula, or pairs only) give the same values.
    inputs: {close: [10, .nan, 12, 11, 10], volume: [100, .nan, 300, .nan, 100]}
    # Worked by hand, not yet checked by the person:(1000 + 3600)/400 = 11.5; 3600/300 = 12.0; (3600 + 1000)/400 = 11.5.
    expected: [null, null, 11.5, 12.0, 11.5]
  - term: "VWAP(3)"
    # A NaN close with a volume (#278): the row is out of both sums. zipline's literal formula
    # keeps its volume in the denominator: 4600/700, 3600/800, 3600/500.
    inputs: {close: [10, .nan, 12, .nan, 11], volume: [100, 300, 300, 200, 0]}
    # Worked by hand, not yet checked by the person: (1000 + 3600)/(100 + 300) = 11.5;
    # 3600/300 = 12.0; (3600 + 0)/(300 + 0) = 12.0.
    expected: [null, null, 11.5, 12.0, 12.0]
  - term: "VWAP(3)"
    # No pair in the window, or the only pair has volume 0 -> NaN (#278). zipline's literal
    # formula gives 0/600, 0/500, 0/700 = 0.
    inputs: {close: [.nan, .nan, .nan, 12, .nan], volume: [100, 200, 300, 0, 400]}
    # Worked by hand, not yet checked by the person: rows 1-3 have no finite close; rows 2-4 and
    # 3-5 have the one pair (12, 0), 0/0.
    expected: [null, null, .nan, .nan, .nan]
