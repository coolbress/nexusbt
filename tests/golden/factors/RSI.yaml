# T-25 (spec 8.2, 3.4): a built-in factor by hand over 5 rows. `check/T-25.py` reaches the same
# literals; implementation pull requests do not change this file. `expected` per row:
# null = warm-up (no full window in the 5 rows), .nan = the factor gives NaN.
factor: RSI
spec: "3.4: d = diff(x); up = nanmean(clip(d, 0, inf)); dn = |nanmean(clip(d, -inf, 0))|; 100 - 100/(1 + up/dn); warm-up W-1"
cases:
  - term: "RSI(4)"
    inputs: {close_tr: [10, 12, 11, 13, .nan]}
    # Worked by hand, not yet checked by the person:row 4, d = 2, -1, 2: up = (2 + 0 + 2)/3, dn = |(0 - 1 + 0)/3| -> up/dn = 4,
    # 100 - 100/5 = 80. Row 5, d = -1, 2, NaN: up = (0 + 2)/2 = 1, dn = 0.5 -> 100 - 100/3.
    # A clipped 0 counts in the mean; a NaN difference does not.
    expected: [null, null, null, 80.0, 66.666667]
