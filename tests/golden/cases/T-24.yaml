# Golden case T-24 (spec 8.2): the three-valued Filter (5.4.1, 3.3) [V31-21, R3-13].
# Expected values are literals. `check/T-24.py` reaches them by plain logic, and
# `tests/golden/test_handcalc_self.py` compares the two. An implementation pull request does
# not change this file (`tests/repo/test_golden_guard.py`); a wrong value reopens the golden
# ticket ("spec deviation").
id: T-24
description: >-
  Three KR instruments at one close decision d. KR:T00003 is halted at d, so its close is NaN.
  Each row is one Filter term: its value per instrument (true, false or unknown) and, at a final
  use (universe, the candidates of top/bottom, mask, screen), the value it becomes there.
spec: "8.2 T-24; 3.3 Filter and Classifier methods, 5.4.1 missing-value rules"

instruments: ["KR:T00001", "KR:T00002", "KR:T00003"]
input:
  close_prev: [.nan, 12000, 8000]   # Price.close.latest at the session before d
  close: [12000, 8000, .nan]        # Price.close.latest at d
  sector: ["x", "y", null]          # Meta.sector at d; null = the missing code -1
  halted: [false, unknown, true]    # Trad.halted at d; unknown = status not known

# `values`: true, false or unknown per instrument, in `instruments` order. `final`: the value at
# a final use, where unknown is false; null for the one row that is a Factor (`as_factor`).
# `.all(2)` and `.any(2)` read close_prev and close (Kleene: false & unknown = false,
# true | unknown = true, otherwise unknown).
#
# Worked by hand (not yet checked by the person):
#   close > 10000 at d:       12000 > 10000 true; 8000 > 10000 false; NaN gives unknown
#   ~ of that:                false, true, unknown (v3 gave true for the halted one)
#   | close.isnan():          true | false = true; false | false = false; unknown | true = true
#   .all(2):                  (unknown, true) unknown; (true, false) false; (false, unknown) false
#   .any(2):                  (unknown, true) true; (true, false) true; (false, unknown) unknown
#   & ~Trad.halted:           true & true = true; false & unknown = false; unknown & false = false
expected:
  - {term: "Price.close.latest > 10000", values: [true, false, unknown], final: [true, false, false]}
  - {term: "~(Price.close.latest > 10000)", values: [false, true, unknown], final: [false, true, false]}
  - {term: "(Price.close.latest > 10000) | Price.close.latest.isnan()", values: [true, false, true], final: [true, false, true]}
  - {term: "(Price.close.latest > 10000).all(2)", values: [unknown, false, false], final: [false, false, false]}
  - {term: "(Price.close.latest > 10000).any(2)", values: [true, true, unknown], final: [true, true, false]}
  - {term: "(Price.close.latest > 10000).as_factor()", values: [1.0, 0.0, .nan], final: null}
  - {term: "Meta.sector.eq(\"x\")", values: [true, false, unknown], final: [true, false, false]}
  - {term: "~Trad.halted", values: [true, unknown, false], final: [true, false, false]}
  - {term: "(~Trad.halted).fillna(True)", values: [true, true, false], final: [true, true, false]}
  - {term: "(Price.close.latest > 10000) & ~Trad.halted", values: [true, false, false], final: [true, false, false]}
