# Golden case T-23 (spec 8.2): the decision dates of `every(5)` do not depend on the start
# date (3.7, INV-14) [RV-C11]. Expected values are literals. `check/T-23.py` reaches them by
# index arithmetic over the session list, and `tests/golden/test_handcalc_self.py` compares the
# two. An implementation pull request does not change this file
# (`tests/repo/test_golden_guard.py`); a wrong value reopens the golden ticket ("spec deviation").
id: T-23
description: >-
  Runs on the `tiny` XKRX calendar (spec 4.8), whose `calendar_sessions.session_ord` numbers
  the sessions from 0 at 2020-01-02 (2020-01-24 and 2020-01-27 are holidays). `nx.every(n,
  offset)` decides on the sessions with (session_ord - offset) mod n == 0, so the decisions of
  a run are that fixed set cut to the run period, whatever the start date. A count that
  started at the run's first session would give the `from_run_start` column; it must not appear.
spec: "8.2 T-23; 3.7 nx.every, 5.1.6 aligning start, 1.3 INV-14"

calendar:
  calendar_id: XKRX
  session_ord: {"2020-01-02": 0, "2020-01-09": 5, "2020-01-16": 10, "2020-01-23": 15, "2020-01-28": 16, "2020-02-03": 20, "2020-02-10": 25, "2020-02-17": 30, "2020-02-24": 35}

# One row per run and schedule. `aligned_start`: 5.1.6. `decisions`: the schedule's sessions
# inside the run. `from_run_start`: every n-th session counted from the aligned start, the
# wrong anchor, shown so the difference is visible; equal to `decisions` only in the first row.
#
# Hand-checked 2026-11-10 (#222), via the coordinating session, recomputed from the tiny
# holiday table (2020-01-24, 2020-01-27) and 3.7 without this file, all four rows:
#   every(5): ord 0, 5, 10, 15, 20, 25, 30, 35 = 01-02, 01-09, 01-16, 01-23, 02-03, 02-10, 02-17, 02-24
#   start 2020-01-08 (ord 4): the same set from ord 5 on; counted from the start, ord 4, 9, 14, 19,
#     24, 29, 34, 39 = 01-08, 01-15, 01-22, 01-31, 02-07, 02-14, 02-21, 02-28 would appear instead
#   start 2020-01-24 (holiday) -> 2020-01-28 (ord 16): the set from ord 20 on
#   every(5, offset=2): ord 2, 7, 12, 17, 22, 27, 32, 37
expected:
  - {term: "every(5)", start: "2020-01-02", end: "2020-02-28", aligned_start: "2020-01-02", decisions: ["2020-01-02", "2020-01-09", "2020-01-16", "2020-01-23", "2020-02-03", "2020-02-10", "2020-02-17", "2020-02-24"], from_run_start: ["2020-01-02", "2020-01-09", "2020-01-16", "2020-01-23", "2020-02-03", "2020-02-10", "2020-02-17", "2020-02-24"]}
  - {term: "every(5)", start: "2020-01-08", end: "2020-02-28", aligned_start: "2020-01-08", decisions: ["2020-01-09", "2020-01-16", "2020-01-23", "2020-02-03", "2020-02-10", "2020-02-17", "2020-02-24"], from_run_start: ["2020-01-08", "2020-01-15", "2020-01-22", "2020-01-31", "2020-02-07", "2020-02-14", "2020-02-21", "2020-02-28"]}
  - {term: "every(5)", start: "2020-01-24", end: "2020-02-28", aligned_start: "2020-01-28", decisions: ["2020-02-03", "2020-02-10", "2020-02-17", "2020-02-24"], from_run_start: ["2020-01-28", "2020-02-04", "2020-02-11", "2020-02-18", "2020-02-25"]}
  - {term: "every(5, offset=2)", start: "2020-01-02", end: "2020-02-28", aligned_start: "2020-01-02", decisions: ["2020-01-06", "2020-01-13", "2020-01-20", "2020-01-29", "2020-02-05", "2020-02-12", "2020-02-19", "2020-02-26"], from_run_start: ["2020-01-02", "2020-01-09", "2020-01-16", "2020-01-23", "2020-02-03", "2020-02-10", "2020-02-17", "2020-02-24"]}
